name: Flutter Prototype APK

on:
  push:
    branches:
      - arena/019fb964-rebelion
  workflow_dispatch:

jobs:
  build-flutter-debug-apk:
    name: Build Flutter debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        working-directory: apps/mobile
        run: flutter create . --platforms=android --project-name rebelion_mobile --org com.rebelion

      - name: Get dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Build debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebelion-prototype-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
